name: Verify public Solario installer

on:
  push:
    branches:
      - release/solario-0.6.29-final
    paths:
      - .github/workflows/verify-public-installer.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Parse Home Assistant app metadata
        uses: home-assistant/actions/helpers/info@a7c616ce81ccda50150bf1595786c71b1883fabb
        with:
          path: ./solario

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: "0.6.29"' solario/config.yaml
          grep -Fx 'image: ghcr.io/gonza11125/solario-local' solario/config.yaml
          grep -Fx '  - amd64' solario/config.yaml
          grep -Fx '  - aarch64' solario/config.yaml
          grep -Fx '  3000/tcp: null' solario/config.yaml
          grep -Fx 'ingress: true' solario/config.yaml

      - name: Verify anonymous image pull
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f "$HOME/.docker/config.json"
          docker pull ghcr.io/gonza11125/solario-local:0.6.29
